<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>GestPrimes</title>
  <script src="https://unpkg.com/react@18/umd/react.development.js" crossorigin></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.development.js" crossorigin></script>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { font-family: 'Inter', system-ui, sans-serif; background: #F8FAFC; color: #0F172A; }
    input, select, button { font-family: inherit; }
    @keyframes spin { to { transform: rotate(360deg); } }
  </style>
</head>
<body>
  <div id="root"></div>
  <script>
    const { useState, useEffect, useCallback, createElement: h, Fragment } = React;

    const FB_API     = "AIzaSyAleF1tlLQjDxQPQdvAw6u_CjjRjZt4OPA";
    const FB_PROJECT = "projet-ct-45e08";
    const BASE       = "https://firestore.googleapis.com/v1/projects/" + FB_PROJECT + "/databases/(default)/documents";

    async function fsGet(col, docId) {
      try {
        const r = await fetch(BASE + "/" + col + "/" + docId + "?key=" + FB_API);
        if (!r.ok) return null;
        const d = await r.json();
        return d.fields && d.fields.data && d.fields.data.stringValue ? JSON.parse(d.fields.data.stringValue) : null;
      } catch { return null; }
    }

    async function fsSet(col, docId, data) {
      try {
        const res = await fetch(BASE + "/" + col + "/" + docId + "?key=" + FB_API, {
          method: "PATCH",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ fields: { data: { stringValue: JSON.stringify(data) } } }),
        });
        return res.ok;
      } catch { return false; }
    }

    const INITIAL_USERS = [
      { id: 1, name: "Fabien Piriou",    email: "fabien.piriou@ctengineeringgroup.com",   role: "manager",  password: "Kx9#mP2q" },
      { id: 2, name: "Marie Radenac",    email: "marie.radenac@ctengineeringgroup.com",   role: "employee", password: "Tz5!vL8n" },
      { id: 3, name: "Adrian Maguet",    email: "adrian.maguet@ctengineeringgroup.com",   role: "employee", password: "Ry3@wJ6h" },
      { id: 4, name: "Baptiste Gourret", email: "baptiste.gourret@ctengineeringgroup.com",role: "manager",  password: "1234" },
    ];

    const PRIME_TYPES = [
      "Déplacement professionnel","Astreinte","Heures supplémentaires",
      "Prime de performance","Frais de représentation","Autre",
    ];

    const STATUS_LABELS = { pending: "En attente", approved: "Approuvée", rejected: "Refusée" };
    const STATUS_COLORS = { pending: "#854D0E", approved: "#166534", rejected: "#991B1B" };
    const STATUS_BG     = { pending: "#FEF9C3", approved: "#DCFCE7", rejected: "#FEE2E2" };

    const C = {
      bg: "#F8FAFC", white: "#FFFFFF", border: "#E2E8F0",
      text: "#0F172A", muted: "#64748B", subtle: "#94A3B8",
      primary: "#3B82F6", danger: "#EF4444", success: "#22C55E",
      surface: "#F1F5F9",
    };

    const inp = {
      width: "100%", border: "1.5px solid " + C.border, borderRadius: 8,
      padding: "10px 13px", fontSize: 14, outline: "none",
      color: C.text, background: C.white, boxSizing: "border-box",
    };

    function Label({ children }) {
      return h("label", { style: { fontSize: 11, fontWeight: 700, color: C.muted, marginBottom: 6, display: "block", textTransform: "uppercase", letterSpacing: 0.6 } }, children);
    }

    function Badge({ status }) {
      return h("span", { style: { display: "inline-block", padding: "3px 11px", borderRadius: 99, fontSize: 11, fontWeight: 700, background: STATUS_BG[status], color: STATUS_COLORS[status] } }, STATUS_LABELS[status]);
    }

    function emptyLine() {
      return { id: Date.now() + Math.random(), startDate: "", endDate: "", primeType: "", lieu: "", comment: "" };
    }

    function App() {
      const [users,      setUsers]      = useState([]);
      const [requests,   setRequests]   = useState([]);
      const [notifs,     setNotifs]     = useState([]);
      const [user,       setUser]       = useState(null);
      const [page,       setPage]       = useState("login");
      const [loginData,  setLoginData]  = useState({ email: "", password: "" });
      const [loginErr,   setLoginErr]   = useState("");
      const [showNotifs, setShowNotifs] = useState(false);
      const [reg,        setReg]        = useState({ name: "", email: "", password: "", confirm: "", role: "employee" });
      const [regErr,     setRegErr]     = useState("");
      const [regOk,      setRegOk]      = useState("");
      const [managerId,  setManagerId]  = useState("");
      const [lines,      setLines]      = useState([emptyLine()]);
      const [formErr,    setFormErr]    = useState("");
      const [formOk,     setFormOk]     = useState("");
      const [loading,    setLoading]    = useState(true);
      const [syncing,    setSyncing]    = useState(false);

      const loadAll = useCallback(async () => {
        try {
          let u = await fsGet("meta", "users");
          if (!u || !Array.isArray(u) || u.length === 0) {
            await fsSet("meta", "users", INITIAL_USERS);
            u = INITIAL_USERS;
          }
          const [r, n] = await Promise.all([fsGet("meta", "requests"), fsGet("meta", "notifs")]);
          setUsers(u);
          setRequests(Array.isArray(r) ? r : []);
          setNotifs(Array.isArray(n) ? n : []);
        } catch(e) { console.error(e); }
        setLoading(false);
      }, []);

      useEffect(() => { loadAll(); }, [loadAll]);

      useEffect(() => {
        const id = setInterval(async () => {
          try {
            const [u, r, n] = await Promise.all([fsGet("meta","users"), fsGet("meta","requests"), fsGet("meta","notifs")]);
            if (Array.isArray(u)) setUsers(u);
            if (Array.isArray(r)) setRequests(r);
            if (Array.isArray(n)) setNotifs(n);
          } catch {}
        }, 8000);
        return () => clearInterval(id);
      }, []);

      async function syncAll() {
        setSyncing(true);
        await loadAll();
        setTimeout(() => setSyncing(false), 700);
      }

      async function resetUsers() {
        await fsSet("meta", "users", INITIAL_USERS);
        setUsers(INITIAL_USERS);
        alert("Comptes réinitialisés !");
      }

      const managers          = users.filter(u => u.role === "manager");
      const myNotifs          = user ? notifs.filter(n => n.userId === user.id && !n.read) : [];
      const myRequests        = user ? requests.filter(r => r.employeeId === user.id) : [];
      const pendingForManager = user ? requests.filter(r => r.managerId === user.id && r.status === "pending") : [];
      const allForManager     = user ? requests.filter(r => r.managerId === user.id) : [];

      async function login() {
        const fresh = await fsGet("meta", "users");
        const pool  = Array.isArray(fresh) && fresh.length > 0 ? fresh : users;
        const found = pool.find(u => u.email.toLowerCase() === loginData.email.toLowerCase() && u.password === loginData.password);
        if (!found) { setLoginErr("Email ou mot de passe incorrect."); return; }
        if (Array.isArray(fresh)) setUsers(fresh);
        setUser(found);
        setPage(found.role === "manager" ? "manager" : "form");
        setLoginErr("");
      }

      function logout() { setUser(null); setPage("login"); setLoginData({ email: "", password: "" }); setShowNotifs(false); }

      async function register() {
        setRegErr("");
        if (!reg.name || !reg.email || !reg.password || !reg.confirm) { setRegErr("Tous les champs sont obligatoires."); return; }
        if (reg.password !== reg.confirm) { setRegErr("Les mots de passe ne correspondent pas."); return; }
        if (reg.password.length < 4) { setRegErr("Mot de passe trop court."); return; }
        if (users.find(u => u.email.toLowerCase() === reg.email.toLowerCase())) { setRegErr("Cet email est déjà utilisé."); return; }
        const newUser   = { id: Date.now(), name: reg.name, email: reg.email, role: reg.role, password: reg.password };
        const updated   = [...users, newUser];
        await fsSet("meta", "users", updated);
        setUsers(updated);
        setRegOk("Compte créé ! Vous pouvez vous connecter.");
        setTimeout(() => { setPage("login"); setRegOk(""); setReg({ name: "", email: "", password: "", confirm: "", role: "employee" }); }, 1800);
      }

      function updateLine(id, f, v) { setLines(p => p.map(l => l.id === id ? { ...l, [f]: v } : l)); }
      function addLine()      { setLines(p => [...p, emptyLine()]); }
      function removeLine(id) { if (lines.length > 1) setLines(p => p.filter(l => l.id !== id)); }

      async function submitRequest() {
        setFormErr("");
        if (!managerId) { setFormErr("Veuillez sélectionner un manager."); return; }
        for (const l of lines) {
          if (!l.startDate || !l.endDate || !l.primeType) { setFormErr("Veuillez compléter toutes les lignes."); return; }
          if (l.startDate > l.endDate) { setFormErr("Date de fin antérieure à la date de début."); return; }
        }
        const mgr = users.find(u => u.id === parseInt(managerId));
        const newReqs = lines.map(l => ({
          id: Date.now() + Math.random(),
          employeeId: user.id, employeeName: user.name,
          managerId: parseInt(managerId), managerName: mgr ? mgr.name : "",
          startDate: l.startDate, endDate: l.endDate,
          primeType: l.primeType, lieu: l.lieu, comment: l.comment,
          status: "pending", createdAt: new Date().toISOString(),
        }));
        const updatedReqs   = [...requests, ...newReqs];
        const newNotif      = { id: Date.now(), userId: parseInt(managerId), message: user.name + " a soumis " + newReqs.length + " demande(s) de prime.", read: false, createdAt: new Date().toISOString() };
        const updatedNotifs = [...notifs, newNotif];
        const [ok1, ok2]    = await Promise.all([fsSet("meta","requests", updatedReqs), fsSet("meta","notifs", updatedNotifs)]);
        if (!ok1 || !ok2) { setFormErr("Erreur d'enregistrement. Réessayez."); return; }
        setRequests(updatedReqs); setNotifs(updatedNotifs);
        setLines([emptyLine()]); setManagerId("");
        setFormOk(newReqs.length + " demande(s) envoyée(s) avec succès.");
        setTimeout(() => setFormOk(""), 3000);
      }

      async function updateStatus(reqId, status) {
        const req = requests.find(r => r.id === reqId);
        const updatedReqs   = requests.map(r => r.id === reqId ? { ...r, status } : r);
        const newNotif      = req ? { id: Date.now(), userId: req.employeeId, message: 'Votre demande "' + req.primeType + '" a été ' + (status === "approved" ? "approuvée" : "refusée") + " par " + user.name + ".", read: false, createdAt: new Date().toISOString() } : null;
        const updatedNotifs = newNotif ? [...notifs, newNotif] : notifs;
        await Promise.all([fsSet("meta","requests", updatedReqs), fsSet("meta","notifs", updatedNotifs)]);
        setRequests(updatedReqs); setNotifs(updatedNotifs);
      }

      async function markRead() {
        const updated = notifs.map(n => n.userId === (user && user.id) ? { ...n, read: true } : n);
        await fsSet("meta", "notifs", updated);
        setNotifs(updated); setShowNotifs(false);
      }

      // Écran de chargement
      if (loading) return h("div", { style: { minHeight: "100vh", background: C.bg, display: "flex", flexDirection: "column", alignItems: "center", justifyContent: "center", gap: 14 } },
        h("div", { style: { width: 36, height: 36, border: "3px solid " + C.border, borderTop: "3px solid " + C.primary, borderRadius: "50%", animation: "spin .8s linear infinite" } }),
        h("p", { style: { color: C.muted, fontSize: 13 } }, "Connexion à Firebase…")
      );

      // NavBar
      const navbar = h("nav", { style: { background: C.white, borderBottom: "1px solid " + C.border, padding: "0 1.5rem", height: 58, display: "flex", alignItems: "center", justifyContent: "space-between", position: "sticky", top: 0, zIndex: 50 } },
        h("div", { style: { display: "flex", alignItems: "center", gap: 10 } },
          h("div", { style: { width: 28, height: 28, background: C.primary, borderRadius: 7, display: "flex", alignItems: "center", justifyContent: "center" } },
            h("span", { style: { color: "#fff", fontSize: 13, fontWeight: 800 } }, "G")
          ),
          h("span", { style: { fontWeight: 700, fontSize: 15, letterSpacing: -0.4 } }, "GestPrimes")
        ),
        user && h("div", { style: { display: "flex", alignItems: "center", gap: 8 } },
          h("button", { onClick: syncAll, style: { background: C.surface, border: "none", borderRadius: 7, padding: "6px 12px", fontSize: 12, cursor: "pointer", color: C.muted } },
            syncing ? "Actualisation…" : "Actualiser"
          ),
          h("div", { style: { position: "relative" } },
            h("button", { onClick: () => setShowNotifs(v => !v), style: { background: C.surface, border: "none", borderRadius: 7, padding: "6px 12px", fontSize: 12, cursor: "pointer", color: C.muted, position: "relative" } },
              "Notifications",
              myNotifs.length > 0 && h("span", { style: { position: "absolute", top: -4, right: -4, background: C.danger, color: "#fff", borderRadius: 99, width: 16, height: 16, fontSize: 10, fontWeight: 800, display: "flex", alignItems: "center", justifyContent: "center" } }, myNotifs.length)
            ),
            showNotifs && h("div", { style: { position: "absolute", right: 0, top: 42, width: 320, background: C.white, border: "1px solid " + C.border, borderRadius: 12, boxShadow: "0 12px 32px rgba(0,0,0,0.1)", zIndex: 100, padding: 14 } },
              h("div", { style: { display: "flex", justifyContent: "space-between", alignItems: "center", marginBottom: 12 } },
                h("span", { style: { fontWeight: 700, fontSize: 13 } }, "Notifications"),
                myNotifs.length > 0 && h("button", { onClick: markRead, style: { background: "none", border: "1px solid " + C.border, borderRadius: 6, padding: "3px 9px", fontSize: 11, cursor: "pointer", color: C.muted } }, "Tout lu")
              ),
              notifs.filter(n => n.userId === user.id).length === 0
                ? h("p", { style: { color: C.subtle, fontSize: 13, textAlign: "center", padding: "1rem 0" } }, "Aucune notification")
                : [...notifs.filter(n => n.userId === user.id)].reverse().slice(0, 10).map(n =>
                    h("div", { key: n.id, style: { padding: "10px 12px", borderRadius: 8, background: n.read ? C.surface : "#EFF6FF", marginBottom: 6, borderLeft: n.read ? "3px solid transparent" : "3px solid " + C.primary } },
                      h("p", { style: { fontSize: 13, color: n.read ? C.muted : C.text, margin: 0 } }, n.message),
                      h("p", { style: { fontSize: 11, color: C.subtle, margin: "4px 0 0" } }, new Date(n.createdAt).toLocaleString("fr-FR"))
                    )
                  )
            )
          ),
          h("div", { style: { display: "flex", alignItems: "center", gap: 8, padding: "5px 10px", background: C.surface, borderRadius: 8 } },
            h("div", { style: { width: 24, height: 24, background: C.primary, borderRadius: "50%", display: "flex", alignItems: "center", justifyContent: "center" } },
              h("span", { style: { color: "#fff", fontSize: 11, fontWeight: 700 } }, user.name[0])
            ),
            h("span", { style: { fontSize: 13, fontWeight: 500 } }, user.name)
          ),
          h("button", { onClick: logout, style: { background: "none", border: "1px solid " + C.border, borderRadius: 7, padding: "6px 12px", fontSize: 12, cursor: "pointer", color: C.muted } }, "Déconnexion")
        )
      );

      // TabBar
      function tabBar(tabs) {
        return h("div", { style: { display: "flex", gap: 3, marginBottom: "1.5rem", background: C.white, border: "1px solid " + C.border, borderRadius: 10, padding: 4 } },
          ...tabs.map(([key, label]) =>
            h("button", { key, onClick: () => setPage(key), style: { flex: 1, background: page === key ? C.primary : "transparent", color: page === key ? "#fff" : C.muted, border: "none", borderRadius: 7, padding: "8px 16px", fontSize: 13, cursor: "pointer", fontWeight: page === key ? 600 : 400 } }, label)
          )
        );
      }

      // Page login
      if (!user && page === "login") return h("div", { style: { minHeight: "100vh", background: C.bg } },
        navbar,
        h("div", { style: { maxWidth: 420, margin: "3rem auto", padding: "0 1rem" } },
          h("div", { style: { background: C.white, border: "1px solid " + C.border, borderRadius: 12, padding: "1.5rem" } },
            h("h2", { style: { fontSize: 20, fontWeight: 700, marginBottom: 6, textAlign: "center" } }, "Connexion"),
            h("p", { style: { color: C.muted, fontSize: 13, textAlign: "center", marginBottom: "1.5rem" } }, "Accédez à votre espace GestPrimes"),
            h("div", { style: { marginBottom: 13 } },
              h(Label, null, "Adresse e-mail"),
              h("input", { style: inp, type: "email", placeholder: "prenom.nom@entreprise.fr", value: loginData.email, onChange: e => setLoginData(p => ({ ...p, email: e.target.value })), onKeyDown: e => e.key === "Enter" && login() })
            ),
            h("div", { style: { marginBottom: 20 } },
              h(Label, null, "Mot de passe"),
              h("input", { style: inp, type: "password", placeholder: "••••••••", value: loginData.password, onChange: e => setLoginData(p => ({ ...p, password: e.target.value })), onKeyDown: e => e.key === "Enter" && login() })
            ),
            loginErr && h("p", { style: { color: C.danger, fontSize: 13, marginBottom: 12, fontWeight: 500 } }, loginErr),
            h("button", { onClick: login, style: { width: "100%", background: C.primary, color: "#fff", border: "none", borderRadius: 8, padding: 11, fontSize: 14, cursor: "pointer", fontWeight: 600 } }, "Se connecter"),
            h("div", { style: { display: "flex", alignItems: "center", gap: 10, margin: "16px 0" } },
              h("div", { style: { flex: 1, height: 1, background: C.border } }),
              h("span", { style: { fontSize: 12, color: C.subtle } }, "ou"),
              h("div", { style: { flex: 1, height: 1, background: C.border } })
            ),
            h("button", { onClick: () => { setPage("register"); setLoginErr(""); }, style: { width: "100%", background: "none", border: "1.5px solid " + C.border, borderRadius: 8, padding: 10, fontSize: 14, cursor: "pointer", color: C.text, fontWeight: 500 } }, "Créer un compte"),
            h("div", { style: { marginTop: 20, padding: 14, background: C.surface, borderRadius: 9, fontSize: 12, color: C.muted, border: "1px solid " + C.border } },
              h("p", { style: { margin: "0 0 8px", fontWeight: 700, color: C.text, fontSize: 12 } }, "Comptes préconfigurés"),
              h("p", { style: { margin: "3px 0" } }, "Manager — fabien.piriou@ctengineeringgroup.com / ", h("strong", null, "Kx9#mP2q")),
              h("p", { style: { margin: "3px 0" } }, "Employé — marie.radenac@ctengineeringgroup.com / ", h("strong", null, "Tz5!vL8n")),
              h("p", { style: { margin: "3px 0" } }, "Employé — adrian.maguet@ctengineeringgroup.com / ", h("strong", null, "Ry3@wJ6h")),
              h("p", { style: { margin: "3px 0" } }, "Manager — baptiste.gourret@ctengineeringgroup.com / ", h("strong", null, "1234")),
              h("button", { onClick: resetUsers, style: { marginTop: 10, background: "none", border: "1px solid " + C.border, borderRadius: 6, padding: "4px 10px", fontSize: 11, cursor: "pointer", color: C.muted } }, "Réinitialiser les comptes")
            )
          )
        )
      );

      // Page register
      if (!user && page === "register") return h("div", { style: { minHeight: "100vh", background: C.bg } },
        navbar,
        h("div", { style: { maxWidth: 420, margin: "3rem auto", padding: "0 1rem" } },
          h("div", { style: { background: C.white, border: "1px solid " + C.border, borderRadius: 12, padding: "1.5rem" } },
            h("h2", { style: { fontSize: 20, fontWeight: 700, marginBottom: "1.5rem", textAlign: "center" } }, "Créer un compte"),
            ...[["name","Nom complet","text","Prénom Nom"],["email","Adresse e-mail","email","prenom.nom@entreprise.fr"],["password","Mot de passe","password","••••••••"],["confirm","Confirmer","password","••••••••"]].map(([f,lbl,t,ph]) =>
              h("div", { key: f, style: { marginBottom: 13 } },
                h(Label, null, lbl),
                h("input", { style: inp, type: t, placeholder: ph, value: reg[f], onChange: e => setReg(p => ({ ...p, [f]: e.target.value })) })
              )
            ),
            h("div", { style: { marginBottom: 20 } },
              h(Label, null, "Rôle"),
              h("select", { style: { ...inp, cursor: "pointer" }, value: reg.role, onChange: e => setReg(p => ({ ...p, role: e.target.value })) },
                h("option", { value: "employee" }, "Employé"),
                h("option", { value: "manager" }, "Manager")
              )
            ),
            regErr && h("p", { style: { color: C.danger, fontSize: 13, marginBottom: 12, fontWeight: 500 } }, regErr),
            regOk  && h("p", { style: { color: C.success, fontSize: 13, marginBottom: 12, fontWeight: 500 } }, regOk),
            h("button", { onClick: register, style: { width: "100%", background: C.primary, color: "#fff", border: "none", borderRadius: 8, padding: 11, fontSize: 14, cursor: "pointer", fontWeight: 600 } }, "Créer le compte"),
            h("div", { style: { height: 1, background: C.border, margin: "16px 0" } }),
            h("button", { onClick: () => { setPage("login"); setRegErr(""); setRegOk(""); }, style: { width: "100%", background: "none", border: "1.5px solid " + C.border, borderRadius: 8, padding: 10, fontSize: 14, cursor: "pointer", color: C.text } }, "Retour à la connexion")
          )
        )
      );

      // Page principale
      return h("div", { style: { minHeight: "100vh", background: C.bg } },
        navbar,
        h("div", { style: { maxWidth: 720, margin: "0 auto", padding: "2rem 1rem" } },

          // VUE EMPLOYÉ
          user && user.role === "employee" && h(Fragment, null,
            tabBar([["form","Nouvelle demande"],["history","Mes demandes" + (myRequests.length > 0 ? " (" + myRequests.length + ")" : "")]]),

            page === "form" && h(Fragment, null,
              h("h2", { style: { fontSize: 17, fontWeight: 700, marginBottom: "1.25rem" } }, "Soumettre une demande de prime"),
              h("div", { style: { background: C.white, border: "1px solid " + C.border, borderRadius: 12, padding: "1.5rem" } },
                h("div", { style: { marginBottom: 18 } },
                  h(Label, null, "Manager valideur *"),
                  h("select", { style: { ...inp, cursor: "pointer" }, value: managerId, onChange: e => setManagerId(e.target.value) },
                    h("option", { value: "" }, "Sélectionner un manager"),
                    ...managers.map(m => h("option", { key: m.id, value: m.id }, m.name))
                  )
                ),
                h("div", { style: { height: 1, background: C.border, margin: "18px 0" } }),
                h("p", { style: { fontWeight: 600, fontSize: 13, marginBottom: 12 } }, "Périodes de prime (" + lines.length + ")"),
                ...lines.map((l, i) =>
                  h("div", { key: l.id, style: { background: C.surface, border: "1px solid " + C.border, borderRadius: 10, padding: "1rem", marginBottom: 10 } },
                    h("div", { style: { display: "flex", justifyContent: "space-between", alignItems: "center", marginBottom: 12 } },
                      h("span", { style: { fontSize: 11, fontWeight: 700, color: C.subtle, textTransform: "uppercase", letterSpacing: 0.6 } }, "Ligne " + (i + 1)),
                      lines.length > 1 && h("button", { onClick: () => removeLine(l.id), style: { background: "none", border: "none", cursor: "pointer", color: C.subtle, fontSize: 18 } }, "×")
                    ),
                    h("div", { style: { display: "grid", gridTemplateColumns: "1fr 1fr", gap: 12, marginBottom: 12 } },
                      h("div", null, h(Label, null, "Date de début *"), h("input", { style: inp, type: "date", value: l.startDate, onChange: e => updateLine(l.id, "startDate", e.target.value) })),
                      h("div", null, h(Label, null, "Date de fin *"),   h("input", { style: inp, type: "date", value: l.endDate,   onChange: e => updateLine(l.id, "endDate",   e.target.value) }))
                    ),
                    h("div", { style: { marginBottom: 12 } },
                      h(Label, null, "Type de prime *"),
                      h("select", { style: { ...inp, cursor: "pointer" }, value: l.primeType, onChange: e => updateLine(l.id, "primeType", e.target.value) },
                        h("option", { value: "" }, "Sélectionner un type"),
                        ...PRIME_TYPES.map(t => h("option", { key: t, value: t }, t))
                      )
                    ),
                    h("div", { style: { display: "grid", gridTemplateColumns: "1fr 1fr", gap: 12 } },
                      h("div", null, h(Label, null, "Lieu (optionnel)"),        h("input", { style: inp, type: "text", placeholder: "Ex : Paris, Lyon…", value: l.lieu,    onChange: e => updateLine(l.id, "lieu",    e.target.value) })),
                      h("div", null, h(Label, null, "Commentaire (optionnel)"), h("input", { style: inp, type: "text", placeholder: "Détails…",            value: l.comment, onChange: e => updateLine(l.id, "comment", e.target.value) }))
                    )
                  )
                ),
                h("button", { onClick: addLine, style: { width: "100%", background: "none", border: "1.5px dashed " + C.border, borderRadius: 8, padding: 9, fontSize: 13, cursor: "pointer", color: C.muted, marginBottom: 16 } }, "+ Ajouter une ligne"),
                formErr && h("p", { style: { color: C.danger, fontSize: 13, marginBottom: 12, fontWeight: 500 } }, formErr),
                formOk  && h("p", { style: { color: C.success, fontSize: 13, marginBottom: 12, fontWeight: 500 } }, formOk),
                h("button", { onClick: submitRequest, style: { background: C.primary, color: "#fff", border: "none", borderRadius: 8, padding: "10px 24px", fontSize: 14, cursor: "pointer", fontWeight: 600 } }, "Envoyer la demande")
              )
            ),

            page === "history" && h(Fragment, null,
              h("h2", { style: { fontSize: 17, fontWeight: 700, marginBottom: "1.25rem" } }, "Mes demandes"),
              myRequests.length === 0 && h("p", { style: { color: C.muted, textAlign: "center", marginTop: "2rem" } }, "Aucune demande pour l'instant."),
              ...[...myRequests].reverse().map(r =>
                h("div", { key: r.id, style: { background: C.white, border: "1px solid " + C.border, borderRadius: 10, padding: "1.25rem", marginBottom: 10 } },
                  h("div", { style: { display: "flex", justifyContent: "space-between", alignItems: "flex-start", marginBottom: 6 } },
                    h("div", null,
                      h("p", { style: { fontWeight: 600, fontSize: 14, margin: 0 } }, r.primeType),
                      h("p", { style: { fontSize: 13, color: C.muted, margin: "3px 0 0" } }, r.startDate + " — " + r.endDate + (r.lieu ? " · " + r.lieu : ""))
                    ),
                    h(Badge, { status: r.status })
                  ),
                  h("p", { style: { fontSize: 13, color: C.muted, margin: "4px 0 0" } }, "Manager : " + r.managerName),
                  r.comment && h("p", { style: { fontSize: 13, color: C.muted, margin: "3px 0 0" } }, r.comment),
                  h("p", { style: { fontSize: 12, color: C.subtle, margin: "8px 0 0" } }, "Soumis le " + new Date(r.createdAt).toLocaleDateString("fr-FR"))
                )
              )
            )
          ),

          // VUE MANAGER
          user && user.role === "manager" && h(Fragment, null,
            tabBar([["manager","À valider" + (pendingForManager.length > 0 ? " (" + pendingForManager.length + ")" : "")],["manager-history","Historique"]]),

            page === "manager" && h(Fragment, null,
              h("h2", { style: { fontSize: 17, fontWeight: 700, marginBottom: "1.25rem" } }, "Demandes à valider"),
              pendingForManager.length === 0 && h("p", { style: { color: C.muted, textAlign: "center", marginTop: "2rem" } }, "Aucune demande en attente."),
              ...pendingForManager.map(r =>
                h("div", { key: r.id, style: { background: C.white, border: "1px solid " + C.border, borderRadius: 10, padding: "1.25rem", marginBottom: 10 } },
                  h("div", { style: { display: "flex", justifyContent: "space-between", alignItems: "flex-start", marginBottom: 6 } },
                    h("div", null,
                      h("p", { style: { fontWeight: 600, fontSize: 14, margin: 0 } }, r.primeType),
                      h("p", { style: { fontSize: 13, color: C.text, fontWeight: 500, margin: "3px 0 0" } }, r.employeeName)
                    ),
                    h(Badge, { status: "pending" })
                  ),
                  h("p", { style: { fontSize: 13, color: C.muted, margin: "4px 0 0" } }, r.startDate + " — " + r.endDate + (r.lieu ? " · " + r.lieu : "")),
                  r.comment && h("p", { style: { fontSize: 13, color: C.muted, margin: "3px 0 0" } }, r.comment),
                  h("p", { style: { fontSize: 12, color: C.subtle, margin: "6px 0 0" } }, "Reçu le " + new Date(r.createdAt).toLocaleDateString("fr-FR")),
                  h("div", { style: { display: "flex", gap: 8, marginTop: 14 } },
                    h("button", { onClick: () => updateStatus(r.id, "approved"), style: { background: "#16A34A", color: "#fff", border: "none", borderRadius: 7, padding: "7px 18px", fontSize: 13, cursor: "pointer", fontWeight: 600 } }, "Approuver"),
                    h("button", { onClick: () => updateStatus(r.id, "rejected"), style: { background: "none", border: "1px solid #FECACA", borderRadius: 7, padding: "7px 18px", fontSize: 13, cursor: "pointer", color: C.danger, fontWeight: 500 } }, "Refuser")
                  )
                )
              )
            ),

            page === "manager-history" && h(Fragment, null,
              h("h2", { style: { fontSize: 17, fontWeight: 700, marginBottom: "1.25rem" } }, "Historique des demandes"),
              allForManager.length === 0 && h("p", { style: { color: C.muted, textAlign: "center", marginTop: "2rem" } }, "Aucune demande reçue."),
              ...[...allForManager].reverse().map(r =>
                h("div", { key: r.id, style: { background: C.white, border: "1px solid " + C.border, borderRadius: 10, padding: "1.25rem", marginBottom: 10 } },
                  h("div", { style: { display: "flex", justifyContent: "space-between", alignItems: "flex-start", marginBottom: 6 } },
                    h("div", null,
                      h("p", { style: { fontWeight: 600, fontSize: 14, margin: 0 } }, r.primeType),
                      h("p", { style: { fontSize: 13, color: C.text, fontWeight: 500, margin: "3px 0 0" } }, r.employeeName)
                    ),
                    h(Badge, { status: r.status })
                  ),
                  h("p", { style: { fontSize: 13, color: C.muted, margin: "4px 0 0" } }, r.startDate + " — " + r.endDate + (r.lieu ? " · " + r.lieu : "")),
                  r.comment && h("p", { style: { fontSize: 13, color: C.muted, margin: "3px 0 0" } }, r.comment),
                  h("p", { style: { fontSize: 12, color: C.subtle, margin: "8px 0 0" } }, "Soumis le " + new Date(r.createdAt).toLocaleDateString("fr-FR"))
                )
              )
            )
          )
        )
      );
    }

    ReactDOM.createRoot(document.getElementById("root")).render(h(App));
  </script>
</body>
</html>
