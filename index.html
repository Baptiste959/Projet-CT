    async function fsGet(col, docId) {
      try {
        const r = await fetch(BASE + "/" + col + "/" + docId + "?key=" + FB_API);
        if (!r.ok) return null;
        const d = await r.json();
        return d.fields && d.fields.data && d.fields.data.stringValue ? JSON.parse(d.fields.data.stringValue) : null;
      } catch { return null; }
    }

    async function fsSet(col, docId, data) {
      try {
        const res = await fetch(BASE + "/" + col + "/" + docId + "?key=" + FB_API, {
          method: "PATCH",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ fields: { data: { stringValue: JSON.stringify(data) } } }),
        });
        return res.ok;
      } catch { return false; }
    }

    function nbJoursOuvres(r) {
      if (!r.startDate || !r.endDate) return 0;
      const [sy, sm, sd] = r.startDate.split("-").map(Number);
      const [ey, em, ed] = r.endDate.split("-").map(Number);
      const d1 = new Date(sy, sm - 1, sd);
      const d2 = new Date(ey, em - 1, ed);
      let count = 0;
      const cur = new Date(d1);
      while (cur <= d2) {
        const day = cur.getDay();
        if (day !== 0 && day !== 6) count++;
        cur.setDate(cur.getDate() + 1);
      }
      return count;
    }

      function datesOverlap(start1, end1, start2, end2) {

      async function submitRequest() {
        setFormErr("");
        if (!managerId) { setFormErr("Veuillez sélectionner un manager."); return; }
        for (const l of lines) {
          if (!l.startDate || !l.endDate || !l.primeType || !l.lieu) { setFormErr("Veuillez compléter toutes les lignes (lieu obligatoire)."); return; }
          if (l.startDate > l.endDate) { setFormErr("Date de fin antérieure à la date de début."); return; }
          if (l.startDate > todayISO()) { setFormErr("La date de début ne peut pas être postérieure à aujourd'hui (pas d'avance de phase)."); return; }
          if (l.endDate > todayISO()) { setFormErr("La date de fin ne peut pas être postérieure à aujourd'hui (pas d'avance de phase)."); return; }
          if (cleanType(l.primeType) === "Prime de déplacement" || cleanType(l.primeType) === "Prime d'éloignement") {
            // Vérifie qu'il y a au moins 3 jours ouvrés consécutifs (sans coupure de week-end)
            let maxConsec = 0, consec = 0;
            const [sy, sm, sd] = l.startDate.split("-").map(Number);
            const [ey, em, ed] = l.endDate.split("-").map(Number);
            const cur = new Date(sy, sm - 1, sd);
            const end = new Date(ey, em - 1, ed);
            while (cur <= end) {
              if (cur.getDay() !== 0 && cur.getDay() !== 6) { consec++; maxConsec = Math.max(maxConsec, consec); }
              else { consec = 0; }
              cur.setDate(cur.getDate() + 1);
            }
            if (maxConsec < 3) { setFormErr("La prime \"" + cleanType(l.primeType) + "\" nécessite au moins 3 jours ouvrés consécutifs (max consécutif trouvé : " + maxConsec + " jour(s))."); return; }
          }
        }

        // Chevauchement entre les lignes du formulaire en cours
        for (let i = 0; i < lines.length; i++) {
          for (let j = i + 1; j < lines.length; j++) {
            if (datesOverlap(lines[i].startDate, lines[i].endDate, lines[j].startDate, lines[j].endDate)) {
              setFormErr("Les dates se chevauchent entre la ligne " + (i + 1) + " et la ligne " + (j + 1) + ".");
              return;
            }
          }
        }

        // Chevauchement avec des demandes déjà existantes (en attente ou approuvées)
        const blockingReqs = requests.filter(r => r.employeeId === user.id && (r.status === "pending" || r.status === "approved"));
        for (const l of lines) {
          const conflict = blockingReqs.find(r => datesOverlap(l.startDate, l.endDate, r.startDate, r.endDate));
          if (conflict) {
            setFormErr("Les dates se chevauchent avec une demande existante (" + conflict.primeType + " du " + conflict.startDate + " au " + conflict.endDate + ").");
            return;
          }
        }

        const mgr = users.find(u => u.id === parseInt(managerId));
        const newReqs = lines.map(l => ({
          id: Date.now() + Math.random(),
          employeeId: user.id, employeeName: user.name,
          managerId: parseInt(managerId), managerName: mgr ? mgr.name : "",
          startDate: l.startDate, endDate: l.endDate,
          primeType: l.primeType, lieu: l.lieu, comment: l.comment, nbJours: l.nbJours || "",
          status: "pending", createdAt: new Date().toISOString(),
        }));
        const updatedReqs   = [...requests, ...newReqs];
        const newNotif      = { id: Date.now(), userId: parseInt(managerId), message: user.name + " a soumis " + newReqs.length + " demande(s) de prime.", read: false, createdAt: new Date().toISOString() };
        const updatedNotifs = [...notifs, newNotif];
        const [ok1, ok2]    = await Promise.all([fsSet("meta","requests", updatedReqs), fsSet("meta","notifs", updatedNotifs)]);
        if (!ok1 || !ok2) { setFormErr("Erreur d'enregistrement. Réessayez."); return; }
        setRequests(updatedReqs); setNotifs(updatedNotifs);
        setLines([emptyLine()]); setManagerId("");
        setFormOk(newReqs.length + " demande(s) envoyée(s) avec succès.");
        setTimeout(() => setFormOk(""), 3000);
      }

        const newNotif      = req ? { id: Date.now(), userId: req.employeeId, message: 'Votre demande "' + req.primeType + '" a été ' + (status === "approved" ? "approuvée" : "refusée") + " par " + user.name + ".", read: false, createdAt: new Date().toISOString() } : null;
        const updatedNotifs = newNotif ? [...notifs, newNotif] : notifs;
        await Promise.all([fsSet("meta","requests", updatedReqs), fsSet("meta","notifs", updatedNotifs)]);
        setRequests(updatedReqs); setNotifs(updatedNotifs);
      }

      function cleanType(t) {
        return (t || "").replace(/\s*\([^)]*\)\s*$/, "").trim();
      }

      async function exportExcel(from, to) {
        const STATUS_FR = { pending: "En attente", approved: "Approuvée", rejected: "Refusée" };
        const BG = { approved: "C6EFCE", pending: "FFEB9C", rejected: "FFC7CE" };
        const FG = { approved: "276221", pending: "9C5700", rejected: "9C0006" };
        const TARIFS = { "Prime de déplacement": 25, "Prime d'éloignement": 35, "Prime bureau/domicile": 30 };

        // Déterminer le mois de référence : la date de fin détermine le mois
        function getMoisRef(startDate, endDate) {
          const src = endDate || startDate;
          const [y, m, d] = src.split("-").map(Number);
          return new Date(y, m - 1, 1);
        }


        const [fy, fm, fd] = from ? from.split("-").map(Number) : [null,null,null];
        const [ty, tm, td] = to   ? to.split("-").map(Number)   : [null,null,null];
        const fromDate = from ? new Date(fy, fm - 1, fd) : null;
        const toDate   = to   ? new Date(ty, tm - 1, td) : null;

        // Si la période d'export fait <= 31 jours, toutes les demandes vont dans le mois de toDate
        const exportDays = (fromDate && toDate) ? Math.round((toDate - fromDate) / 86400000) : 999;
        const moisForcé  = exportDays <= 31 && toDate ? new Date(ty, tm - 1, 1) : null;

        // Filtre Feuille 2 : demande incluse dans la période d'export (startDate ou endDate dans la plage)
        function inRange(r) {
          const [sy, sm, sd] = r.startDate.split("-").map(Number);
          const [ey, em, ed] = (r.endDate || r.startDate).split("-").map(Number);
          const dStart = new Date(sy, sm - 1, sd);
          const dEnd   = new Date(ey, em - 1, ed);
          if (fromDate && dEnd < fromDate) return false;
          if (toDate   && dStart > toDate) return false;
          return true;
        }

        const wb = new ExcelJS.Workbook();
        const periodeLabel = "Période exportée : du " + fmtDate(from) + " au " + fmtDate(to);

        function addTitleRow(ws) {
          ws.insertRow(1, [periodeLabel]);
          ws.mergeCells(1, 1, 1, ws.columnCount);
          const cell = ws.getCell(1, 1);
          cell.font      = { bold: true, size: 12, color: { argb: "FF0F172A" } };
          cell.alignment = { horizontal: "center", vertical: "middle" };
          ws.getRow(1).height = 24;
        }

        // ── Feuille 1 : toutes les demandes ──────────────────────────
        const ws1 = wb.addWorksheet("Toutes les demandes");
        ws1.columns = [
          { header: "Nom",            key: "nom",     width: 18 },
          { header: "Prénom",         key: "prenom",  width: 16 },
          { header: "Date début",     key: "deb",     width: 14 },
          { header: "Date fin",       key: "fin",     width: 14 },
          { header: "Type de prime",  key: "type",    width: 24 },
          { header: "Jours ouvrés",   key: "jours",   width: 13 },
          { header: "Prix unitaire",  key: "prix",    width: 13 },
          { header: "Lieu",           key: "lieu",    width: 18 },
          { header: "Commentaire",    key: "comment", width: 26 },
          { header: "Statut",         key: "statut",  width: 14 },
          { header: "Pris en compte", key: "pec",     width: 14 },
        ];
        ws1.getRow(1).eachCell(cell => {
          cell.fill      = { type: "pattern", pattern: "solid", fgColor: { argb: "FF2563EB" } };
          cell.font      = { bold: true, color: { argb: "FFFFFFFF" }, size: 11 };
          cell.alignment = { horizontal: "center", vertical: "middle" };
        });
        ws1.getRow(1).height = 22;
        addTitleRow(ws1);

        // Feuille 1 : demandes comprises dans la période choisie, hors demandes archivées (pris en compte)
        const allReqs = [...requests].filter(r => inRange(r) && !r.prisEnCompte).sort((a, b) => new Date(b.createdAt) - new Date(a.createdAt));
        allReqs.forEach(r => {
          const parts  = (r.employeeName || "").trim().split(" ");
          const prenom = parts[0] || "";
          const nom    = parts.slice(1).join(" ") || "";
          const bg      = "FF" + (BG[r.status] || BG.pending);
          const fg      = "FF" + (FG[r.status] || FG.pending);
          const typeNom = cleanType(r.primeType);
          const prix    = TARIFS[typeNom] || "";
          const row = ws1.addRow({
            nom, prenom,
            deb: r.startDate || "", fin: r.endDate || "",
            type: typeNom,
            jours: typeNom === "Prime bureau/domicile" ? (r.nbJours || "") : nbJoursOuvres(r),
            prix: prix ? prix + " €" : "",
            lieu: r.lieu || "", comment: r.comment || "",
            statut: STATUS_FR[r.status] || "",
            pec: r.prisEnCompte ? "Oui" : "Non",
          });
          row.eachCell((cell, colNumber) => {
            const isPec = colNumber === row.cellCount;
            cell.fill      = { type: "pattern", pattern: "solid", fgColor: { argb: isPec && !r.prisEnCompte ? "FFFFC7CE" : bg } };
            cell.font      = { color: { argb: isPec && !r.prisEnCompte ? "FF9C0006" : fg }, size: 11, bold: isPec };
            cell.alignment = { horizontal: "center", vertical: "middle" };
          });
          row.height = 18;
        });

        // ── Feuille 2 : récap par employé (montants en €) ────────────
        const ws2 = wb.addWorksheet("Récap mensuel");

        const approvedReqs = requests.filter(r => r.status === "approved" && !r.prisEnCompte && inRange(r));

        const toMoisDate = toDate ? new Date(toDate.getFullYear(), toDate.getMonth(), 1) : null;
        // Une demande non prise en compte dont le mois d'origine est antérieur au mois de fin de l'export
        // est remontée dans ce dernier mois (saisie tardive d'une période déjà clôturée).
        function moisEffectif(r) {
          const m = moisForcé || getMoisRef(r.startDate, r.endDate);
          if (toMoisDate && m < toMoisDate) return toMoisDate;
          return m;
        }

        const moisSet = new Set();
        approvedReqs.forEach(r => {
          const m = moisEffectif(r);
          moisSet.add(m.getFullYear() + "-" + String(m.getMonth() + 1).padStart(2, "0"));
        });
        const moisList = [...moisSet].sort();

        const colsFixes = [
          { header: "Nom",       key: "nom",    width: 18 },
          { header: "Prénom",    key: "prenom", width: 16 },
          { header: "Matricule", key: "mat",    width: 12 },
        ];

        const typeKeys = ["Prime de déplacement", "Prime d'éloignement", "Prime bureau/domicile"];
        const moisLabels = { "01":"Janvier","02":"Février","03":"Mars","04":"Avril","05":"Mai","06":"Juin","07":"Juillet","08":"Août","09":"Septembre","10":"Octobre","11":"Novembre","12":"Décembre" };

        const colsDyn = [];
        moisList.forEach(m => {
          const [yr, mo] = m.split("-");
          const label = moisLabels[mo] + " " + yr;
          typeKeys.forEach(t => {
            colsDyn.push({ header: label + "\n" + t, key: m + "_" + t, width: 21 });
          });
          colsDyn.push({ header: label + "\nTotal €", key: m + "_total", width: 14 });
        });

        ws2.columns = [...colsFixes, ...colsDyn];

        ws2.getRow(1).height = 40;
        ws2.getRow(1).eachCell(cell => {
          cell.fill      = { type: "pattern", pattern: "solid", fgColor: { argb: "FF2563EB" } };
          cell.font      = { bold: true, color: { argb: "FFFFFFFF" }, size: 10 };
          cell.alignment = { horizontal: "center", vertical: "middle", wrapText: true };
        });
        addTitleRow(ws2);

        // Regrouper par employé : montant € = tarif × jours ouvrés
        const empMap = {};
        // Initialiser avec tous les employés, même sans demande
        users.forEach(u => {
          const parts = (u.name || "").trim().split(" ");
          empMap[u.id] = { nom: parts.slice(1).join(" ") || "", prenom: parts[0] || "", mat: u.matricule || "", totals: {} };
        });
        approvedReqs.forEach(r => {
          const key = r.employeeId;
          if (!empMap[key]) {
            const emp = users.find(u => u.id === r.employeeId) || {};
            const parts = (r.employeeName || "").trim().split(" ");
            empMap[key] = { nom: parts.slice(1).join(" ") || "", prenom: parts[0] || "", mat: emp.matricule || "", totals: {} };
          }
          const m = moisEffectif(r);
          const mKey = m.getFullYear() + "-" + String(m.getMonth() + 1).padStart(2, "0");
          const typeNomR = cleanType(r.primeType);
          const colKey = mKey + "_" + typeNomR;
          const joursR  = typeNomR === "Prime bureau/domicile" ? (parseInt(r.nbJours) || 0) : nbJoursOuvres(r);
          const montant = (TARIFS[typeNomR] || 0) * joursR;
          empMap[key].totals[colKey] = (empMap[key].totals[colKey] || 0) + montant;
        });

        const empList = Object.values(empMap).sort((a, b) => a.nom.localeCompare(b.nom));

        const colTotals = {};
        empList.forEach(emp => {
          const rowData = { nom: emp.nom, prenom: emp.prenom, mat: emp.mat };
          moisList.forEach(m => {
            let totalMois = 0;
            typeKeys.forEach(t => {
              const v = emp.totals[m + "_" + t] || 0;
              rowData[m + "_" + t] = v > 0 ? v + " €" : "";
              totalMois += v;
              colTotals[m + "_" + t] = (colTotals[m + "_" + t] || 0) + v;
            });
            rowData[m + "_total"] = totalMois > 0 ? totalMois + " €" : "";
            colTotals[m + "_total"] = (colTotals[m + "_total"] || 0) + totalMois;
          });
          const row = ws2.addRow(rowData);
          row.height = 18;
          row.eachCell(cell => {
            cell.alignment = { horizontal: "center", vertical: "middle" };
            cell.font = { size: 11 };
          });
          row.getCell("nom").alignment    = { horizontal: "left", vertical: "middle" };
          row.getCell("prenom").alignment = { horizontal: "left", vertical: "middle" };
          moisList.forEach(m => {
            const c = row.getCell(m + "_total");
            if (c.value) c.font = { bold: true, size: 11 };
          });
        });

        // Ligne de total général par colonne (mois × type + total mois)
        const totalRowData = { nom: "TOTAL" };
        moisList.forEach(m => {
          typeKeys.forEach(t => {
            const v = colTotals[m + "_" + t] || 0;
            totalRowData[m + "_" + t] = v > 0 ? v + " €" : "";
          });
          const vt = colTotals[m + "_total"] || 0;
          totalRowData[m + "_total"] = vt > 0 ? vt + " €" : "";
        });
        const totalRow = ws2.addRow(totalRowData);
        totalRow.height = 20;
        totalRow.eachCell(cell => {
          cell.fill      = { type: "pattern", pattern: "solid", fgColor: { argb: "FFE2E8F0" } };
          cell.font      = { bold: true, size: 11 };
          cell.alignment = { horizontal: "center", vertical: "middle" };
        });
        totalRow.getCell("nom").alignment = { horizontal: "left", vertical: "middle" };

        // Téléchargement
        const buffer = await wb.xlsx.writeBuffer();
        const blob   = new Blob([buffer], { type: "application/vnd.openxmlformats-officedocument.spreadsheetml.sheet" });
        const url    = URL.createObjectURL(blob);
        const a      = document.createElement("a");
        const date   = new Date().toLocaleDateString("fr-FR").replace(/\//g, "-");
        a.href       = url;
        a.download   = "GestPrimes_" + date + ".xlsx";
        a.click();
        URL.revokeObjectURL(url);
      }
